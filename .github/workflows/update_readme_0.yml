name: Update README Activity

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update README with recent activity
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update activity section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          python3 - <<'EOF'
          import os, json, re, urllib.request

          USERNAME = os.environ['GH_USERNAME']
          TOKEN    = os.environ['GITHUB_TOKEN']
          MAX      = 5

          headers = {
              'Authorization': f'Bearer {TOKEN}',
              'Accept': 'application/vnd.github.v3+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          req = urllib.request.Request(
              f'https://api.github.com/users/{USERNAME}/events/public?per_page=100',
              headers=headers,
          )
          events = json.loads(urllib.request.urlopen(req).read())

          def fmt(e):
              t    = e['type']
              repo = e['repo']['name']
              p    = e.get('payload', {})
              if t == 'PushEvent':
                  n      = len(p.get('commits', []))
                  branch = p.get('ref', '').replace('refs/heads/', '')
                  return f'🔨 Pushed {n} commit{"s" if n!=1 else ""} to `{branch}` in [{repo}](https://github.com/{repo})'
              if t == 'PullRequestEvent':
                  pr = p.get('pull_request', {})
                  return f'🔀 {p.get("action","").capitalize()} PR [{pr.get("title","")}]({pr.get("html_url","")}) in [{repo}](https://github.com/{repo})'
              if t == 'IssuesEvent':
                  iss = p.get('issue', {})
                  return f'❗ {p.get("action","").capitalize()} issue [{iss.get("title","")}]({iss.get("html_url","")}) in [{repo}](https://github.com/{repo})'
              if t == 'IssueCommentEvent':
                  iss = p.get('issue', {})
                  url = p.get('comment', {}).get('html_url', '')
                  return f'💬 Commented on [{iss.get("title","")}]({url}) in [{repo}](https://github.com/{repo})'
              if t == 'WatchEvent':
                  return f'⭐ Starred [{repo}](https://github.com/{repo})'
              if t == 'ForkEvent':
                  return f'🍴 Forked [{repo}](https://github.com/{repo})'
              if t == 'CreateEvent':
                  return f'📂 Created {p.get("ref_type","")} `{p.get("ref","")}` in [{repo}](https://github.com/{repo})'
              if t == 'ReleaseEvent':
                  r = p.get('release', {})
                  return f'🚀 Released [{r.get("name","")}]({r.get("html_url","")}) in [{repo}](https://github.com/{repo})'
              return None

          lines, seen = [], set()
          for e in events:
              if len(lines) >= MAX:
                  break
              s = fmt(e)
              if s and s not in seen:
                  lines.append(s)
                  seen.add(s)

          body = '\n'.join(f'{i+1}. {l}' for i, l in enumerate(lines))

          with open('README.md', encoding='utf-8') as f:
              readme = f.read()

          new = re.sub(
              r'(<!--START_SECTION:activity-->).*?(<!--END_SECTION:activity-->)',
              f'\\1\n{body}\n\\2',
              readme, flags=re.DOTALL,
          )

          if new == readme:
              print('No changes.')
          else:
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new)
              print(f'Updated with {len(lines)} activities.')
          EOF

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "Nothing to commit." || \
            (git add README.md && git commit -m ":zap: Update README with the recent activity" && git push)
